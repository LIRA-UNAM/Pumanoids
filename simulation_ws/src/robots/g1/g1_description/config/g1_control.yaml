controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    g1_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Parámetros específicos del controlador (deben estar en sección separada)
# Ganancias PID necesarias para que los joints resistan gravedad (evitar modo damping)
g1_trajectory_controller:
  ros__parameters:
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      - waist_yaw_joint
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    # Ganancias PID: p=rigidez, d=amortiguamiento. Sin ellas el controlador envía esfuerzo 0.
    gains:
      # Piernas (effort limit 139 Nm) - alta rigidez para sostener el peso
      left_hip_pitch_joint: { p: 150.0, d: 8.0 }
      left_hip_roll_joint: { p: 150.0, d: 8.0 }
      left_hip_yaw_joint: { p: 80.0, d: 5.0 }
      left_knee_joint: { p: 150.0, d: 8.0 }
      left_ankle_pitch_joint: { p: 80.0, d: 5.0 }
      left_ankle_roll_joint: { p: 80.0, d: 5.0 }
      right_hip_pitch_joint: { p: 150.0, d: 8.0 }
      right_hip_roll_joint: { p: 150.0, d: 8.0 }
      right_hip_yaw_joint: { p: 80.0, d: 5.0 }
      right_knee_joint: { p: 150.0, d: 8.0 }
      right_ankle_pitch_joint: { p: 80.0, d: 5.0 }
      right_ankle_roll_joint: { p: 80.0, d: 5.0 }
      # Torso
      waist_yaw_joint: { p: 80.0, d: 5.0 }
      # Brazos (effort limit 25 Nm)
      left_shoulder_pitch_joint: { p: 40.0, d: 3.0 }
      left_shoulder_roll_joint: { p: 40.0, d: 3.0 }
      left_shoulder_yaw_joint: { p: 40.0, d: 3.0 }
      left_elbow_joint: { p: 40.0, d: 3.0 }
      left_wrist_roll_joint: { p: 30.0, d: 2.0 }
      right_shoulder_pitch_joint: { p: 40.0, d: 3.0 }
      right_shoulder_roll_joint: { p: 40.0, d: 3.0 }
      right_shoulder_yaw_joint: { p: 40.0, d: 3.0 }
      right_elbow_joint: { p: 40.0, d: 3.0 }
      right_wrist_roll_joint: { p: 30.0, d: 2.0 }
