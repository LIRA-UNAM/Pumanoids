# Booster K1 — rama booster_k1 (ball_detector.py, ball_follower)
name: k1
display_name: "Booster K1"

camera:
  image_topic: "/camera/color/image_raw"
  camera_info_topic: "/camera/color/camera_info"
  optical_frame_id: "camera_color_optical_frame"
  width: 640
  height: 480
  center_x: 272
  center_y: 240
  hfov_deg: 93.0
  vfov_deg: 101.0
  focal_length_px: 600.0

head:
  height_m: 0.87
  offset_x_m: 0.0
  offset_y_m: 0.0
  pan_min: -1.0
  pan_max: 1.0
  tilt_min: -0.3
  tilt_max: 0.8
  look_for_poses:
    - [0.0, 0.7]
    - [-0.8, 0.7]
    - [-0.8, 0.2]
    - [0.0, 0.2]
    - [0.8, 0.2]
    - [0.8, 0.7]
  track_gain_pan: 0.15
  track_gain_tilt: 0.15
  acquire_gain_pan: -0.65
  acquire_gain_tilt: 0.50

ball_follower:
  image_center_x: 272
  goal_bias: 0.15
  search_angular_speed: 0.5
  search_angle_deg: 45.0
  alignment_threshold_rad: 0.15

localization:
  forward_speed: 0.3
  motion_alphas: [0.001, 0.0003, 0.04, 0.001] 