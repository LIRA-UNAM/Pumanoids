# Booster T1 — rama booster_t1 (ball_detector.py, head_ball_follower.py)
name: t1
display_name: "Booster T1"

camera:
  image_topic: "/boostercamera/head/rgb"
  optical_frame_id: "camera_color_optical_frame"
  width: 1280 #640
  height: 720 #480
  center_x: 640
  center_y: 360
  hfov_deg: 92.5
  vfov_deg: 60.0
  focal_length_px: 600.0

movement:
  angular_speed: 0.8
  linear_speed: 0.8

head:
  height_m: 1.08
  offset_x_m: 0.0
  offset_y_m: 0.0
  pan_min: -1.0
  pan_max: 1.0
  tilt_min: -0.3
  tilt_max: 0.8
  look_for_poses:
    - [0.0, 0.7]
    - [-0.8, 0.7]
    - [-0.8, 0.2]
    - [0.0, 0.2]
    - [0.8, 0.2]
    - [0.8, 0.7]
  track_gain_pan: 0.15
  track_gain_tilt: 0.15
  acquire_gain_pan: -0.65
  acquire_gain_tilt: 0.50

ball_follower:
  image_center_x: 640
  goal_bias: 0.15
  search_angular_speed: 0.5
  search_angle_deg: 45.0
  alignment_threshold_rad: 0.15
  forward_speed_aligned: 4.0

localization:
  forward_speed: 0.3
  motion_alphas: [0.001, 0.0003, 0.04, 0.001] 
