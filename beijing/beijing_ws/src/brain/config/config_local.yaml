brain_node:
  ros__parameters:
    goalkeeper:
      mode: "attack"
      ready:
        dist_to_goalline: 0.8
        dist_tolerance: 0.5
        theta_tolerance: 0.1
        long_range_threshold: 1.0
        turn_threshold: 0.4
        vx_limit: 1.5
        vy_limit: 1.5
        vtheta_limit: 1.5
        avoid_obstacles: true
      blocking:
        dist_tolerance: 0.15
        theta_tolerance: 0.3
        vx_limit: 0.7
        vy_limit: 0.9
        vtheta_limit: 1.5
        position_gain: 2.0
        orientation_gain: 0.6
        dist_to_goalline: 0.8
      chase:
        threshold: 1.2
        vx_limit: 1.7
        vy_limit: 1.7
        vtheta_limit: 1.5
        target_distance: 1.0
        safe_distance: 0.8
      adjust:
        turn_threshold: 0.2
        range: 0.3
        vx_limit: 1.5
        vy_limit: 0.2
        vtheta_limit: 1.0
      claim:
        max_ball_range: 3.0
        max_cost: 5.0
        extra_depth: 1.0
        lateral_margin: 1.0
        require_team_lead: true
      camera:
        track_tolerance_ratio: 0.22
        center_tolerance_factor: 0.8
        filter_time_constant_sec: 0.08
        command_interval_sec: 0.03
        max_pitch_rate: 0.85
        max_yaw_rate: 1.25
        min_command_change: 0.004
        search_cycle_msec: 3000
        search_max_pitch_rate: 0.8
        search_max_yaw_rate: 1.4
      kick:
        type: "visual"
        alignment_tolerance: 1.5707963268
        default:
          speed_limit: 0.5
          min_msec: 600.0
          enable_stabilize: false
          stabilize_msec: 600.0
          exit_range: 3.0
          abort_when_ball_moved: true
          ball_move_threshold: 0.3
        visual:
          min_msec: 1500.0
          max_msec: 5000.0
          range: 2.0
          pre_delay_msec: 200.0
          post_delay_msec: 450.0
      prediction:
        enabled: true
        require_localization: true
        history_msec: 600.0
        max_samples: 20
        min_samples: 5
        min_span_msec: 100.0
        min_speed: 0.45
        max_speed: 8.0
        min_toward_goal_speed: 0.35
        min_r_squared: 0.9
        max_residual: 0.2
        max_sample_jump: 0.8
        continuity_filter_enabled: true
        field_margin: 0.5
        reject_outside_field: true
        min_ball_confidence: 40.0
        recency_weight: 2.0
        deceleration: 0.4
        step_interval_msec: 100.0
        step_count: 30
        goal_margin: 0.15
        min_time_to_block: 0.08
        max_time_to_block: 3.0
        activation_hold_msec: 400.0
        post_block_claim_msec: 2500.0
        intercept:
          enabled: true
          max_forward_distance: 1.2
          front_max_forward_distance: 1.6
          front_min_forward_distance: 0.4
          front_lateral_threshold: 0.25
          min_ball_separation: 0.25
          search_step: 0.1
          robot_speed_min: 0.45
          robot_speed_max: 1.2
          measured_speed_gain: 1.2
          safety_time_sec: 0.12
          diagonal_vx_limit: 1.0
          front_vx_limit: 1.5
        block:
          vx_limit: 0.65
          vy_limit: 1.5
          vtheta_limit: 1.0
          position_gain: 1.5
          reaction_margin_sec: 0.1
          target_tolerance: 0.1
          apply_min_velocity: true
          urgent_time_sec: 0.0
          urgent_lateral_error: 0.2
          urgent_vx_limit: 0.0
          urgent_vy_limit: 1.7
          urgent_vtheta_limit: 0.0
    RLVisionKick:
      visual_kick_version: "kV2"
    obstacle_avoidance:
      avoid_during_kick: false
      kick_ao_safe_dist: 1.5
      enable_fallen_robot_visual_kick_exit: true
      fallen_robot_distance: 3.0
      fallen_robot_angle: 0.785
      avoid_during_chase: false
      chase_ao_safe_dist: 0.6
